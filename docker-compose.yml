services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/vuln_scanner
      # First-run self-scan target inside the container.
      - VULN_SCAN_ROOT=/app
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vuln_scanner
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
